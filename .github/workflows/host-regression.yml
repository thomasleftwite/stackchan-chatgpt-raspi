name: Host regression (API-free)
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  node:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: server
      - run: npm test
        working-directory: server
  python-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install cryptography==43.0.0 pyserial==3.5
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
        working-directory: server
      - run: xvfb-run -a python -m unittest discover -s tests -v
  python-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install pyserial==3.5
      - run: python scripts/run_windows_tests.py
